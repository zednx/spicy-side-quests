name: release

# Push a tag like v0.1.0 to publish a GitHub Release with:
#   SpicySideQuests-vX.Y.Z.zip            the addon (upload this one to CurseForge)
#   SpicySideQuests-Companion-vX.Y.Z.zip  the optional sync scripts
#   SHA256SUMS.txt
# and uploads the addon zip to CurseForge when the CF_API_KEY secret is set.
# Every zip also gets a GitHub build attestation, so anyone can check it was
# built here from this repo's source: gh attestation verify <zip> --repo zednx/spicy-side-quests
#
# Run it manually (Actions -> release -> Run workflow) for a dry run: same
# checks and zips, uploaded as a workflow artifact, nothing published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # the token is only used by the publish step

      - name: Work out the version and check every file agrees
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"
          else v=$(sed -n 's/^## Version: *//p' SpicySideQuests/SpicySideQuests.toc | tr -d '\r'); fi
          # Only plain X.Y.Z versions; anything else stops the release before it is used anywhere.
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Bad version '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          scripts/check-version.sh "$v"

      - name: Addon tests
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.1
          for f in SpicySideQuests/*.lua; do luac5.1 -p "$f"; done
          lua5.1 tests/run.lua

      - name: Build zips
        env:
          v: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dist stage/SpicySideQuests-Companion
          zip -rq "dist/SpicySideQuests-v$v.zip" SpicySideQuests
          c=stage/SpicySideQuests-Companion
          cp -r companion/src companion/powershell companion/package.json companion/tsconfig.json \
                companion/start.cmd companion/start.sh companion/start-powershell.cmd \
                companion/setup.cmd companion/setup.sh companion/setup-powershell.cmd README.md LICENSE CHANGELOG.md "$c/"
          rm -f "$c/powershell/test.ps1"
          (cd stage && zip -rq "../dist/SpicySideQuests-Companion-v$v.zip" SpicySideQuests-Companion)
          (cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          unzip -l "dist/SpicySideQuests-v$v.zip"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.zip

      - name: Release notes
        env:
          v: ${{ steps.v.outputs.version }}
        run: |
          awk -v want="## v$v" '$0==want{f=1;next} /^## v/{f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ---
          **Install:** download `SpicySideQuests-v*.zip`, extract it into `World of Warcraft/_forever_/Interface/AddOns/`, then restart the game.
          **Optional sync:** download the Companion zip and see the [README](https://github.com/zednx/spicy-side-quests#optional-sync-with-a-markdown-file).

          These zips were built by GitHub Actions from this tag's source. To check: `gh attestation verify <zip> --repo zednx/spicy-side-quests`
          EOF
          cat notes.md

      - name: Publish GitHub Release
        id: publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If the release was already drafted in the GitHub web UI, just attach the files.
          # A moved/re-pushed tag refreshes the files but doesn't upload to CurseForge again.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            echo "existed=true" >> "$GITHUB_OUTPUT"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Spicy Side Quests $GITHUB_REF_NAME" --notes-file notes.md
          fi

      - name: Upload to CurseForge
        if: github.ref_type == 'tag' && steps.publish.outputs.existed != 'true'
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: "1794870"
          CF_GAME_VERSIONS: ${{ vars.CF_GAME_VERSIONS }}
          v: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$CF_API_KEY" ]; then
            echo "::warning::CF_API_KEY secret not set, skipping the CurseForge upload."
            exit 0
          fi
          scripts/curseforge-upload.sh "dist/SpicySideQuests-v$v.zip" "$v" notes.md

      - name: Upload dry-run zips
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dry-run
          path: dist/
