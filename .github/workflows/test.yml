name: test
on: [push, pull_request]
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: for f in SpicySideQuests/*.lua; do luac5.1 -p "$f"; done
      - run: lua5.1 tests/run.lua
  companion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save
      - run: npm run typecheck
      - run: npm test
  powershell-windows:
    # Windows PowerShell 5.1, what most users have
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File companion/powershell/test.ps1
        shell: pwsh
  powershell-linux:
    # PowerShell 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pwsh -NoProfile -File companion/powershell/test.ps1
